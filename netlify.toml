# Netlify Configuration for SmartCart

[build]
  command = "npm run build"
  publish = "dist"

# Environment variables can be configured in Netlify Dashboard (Site Settings > Environment Variables)
[build.environment]
  NODE_VERSION = "20"

# SPA routing redirect (All front-end routes redirected to index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional API Proxy redirect if hosting Express backend on Cloud Run, Render, or Railway:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api-url.com/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
